<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rattazzi</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header>
    <button class="btn-icon" id="btn-back" style="display:none" onclick="goBack()">⬅️</button>
    <img src="assets/logo.png" alt="Rattazzi" class="logo-img" id="header-logo">
    <h1 id="header-title" style="display:none;"></h1>
    <button class="btn-icon" id="btn-search" onclick="toast('🔍 Ricerca in arrivo!')">🔍</button>
  </header>

  <main id="main"></main>

  <nav class="bottom">
    <button data-nav="home" onclick="navHome()">
      <span class="nav-emoji">🏠</span><span>Home</span>
    </button>
    <button data-nav="cerca" onclick="toast('🔍 Ricerca in arrivo!')">
      <span class="nav-emoji">🔍</span><span>Cerca</span>
    </button>
    <button data-nav="salva-cloud" onclick="salvaSuCloud()">
      <span class="nav-emoji">☁️</span><span>Salva</span>
    </button>
    <button data-nav="carica-cloud" onclick="caricaDaCloud()">
      <span class="nav-emoji">📥</span><span>Carica</span>
    </button>
    <button data-nav="esporta" onclick="esportaDati()">
      <span class="nav-emoji">📋</span><span>Esporta</span>
    </button>
  </nav>
</div>

<input type="file" id="file-input" accept="image/*" onchange="handleFileUpload(event)" style="display:none">

<div class="toast" id="toast"></div>

<div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet(event)">
  <div class="sheet" id="sheet" onclick="event.stopPropagation()">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="sheet-title"></div>
    <div id="sheet-options"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2 id="modal-title">Modifica</h2>
    <div class="modal-desc" id="modal-desc"></div>
    <div id="modal-body"></div>
    <div class="modal-buttons">
      <button class="btn-secondary" onclick="closeModal()">Annulla</button>
      <button class="btn-primary" id="modal-confirm">Salva</button>
    </div>
  </div>
</div>

<script type="module">
  // Importa le funzioni che ti servono
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getFirestore } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  // La tua configurazione
  const firebaseConfig = {
    apiKey: "AIzaSyDtnu5hz1LpILktBuPseaArP4lDVH7C32Y",
    authDomain: "library-ferr.firebaseapp.com",
    projectId: "library-ferr",
    storageBucket: "library-ferr.firebasestorage.app",
    messagingSenderId: "715706680030",
    appId: "1:715706680030:web:ed622ce8ac2b42c4fc384f"
  };

  // Inizializza Firebase
  const app = initializeApp(firebaseConfig);
  
  // Inizializza Firestore (il database)
  const db = getFirestore(app);

  // Rendi il database disponibile al resto dell'app
  window.firebaseDb = db;
  window.firebaseApp = app;
  
  console.log("🔥 Firebase connesso con successo!");
</script>

<script src="js/app.js"></script>
</body>
</html>
